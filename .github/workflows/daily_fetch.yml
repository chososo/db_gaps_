name: Daily Data Fetch + Report

on:
  schedule:
    # KRX 종가 안정화 후, KST 18:30 = UTC 09:30 (월~금)
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      full:
        description: "Force full re-fetch (ignore parquet cache)"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/loving-einstein-3rG26

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily fetch
        env:
          DB_GAPS_ROOT: ${{ github.workspace }}
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            python scripts/fetch_daily.py --full
          else
            python scripts/fetch_daily.py
          fi

      - name: Build HTML report
        env:
          DB_GAPS_ROOT: ${{ github.workspace }}
        run: python scripts/build_report.py

      - name: Commit updated data + docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily fetch $(date -u +%Y-%m-%d)"
            git push origin HEAD:claude/loving-einstein-3rG26
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
